name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/msclouddev/devops-intern-final

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: ShellCheck
        run: shellcheck scripts/*.sh
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile

  build:
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg BUILD_SHA=${{ github.sha }} --tag "$IMAGE_NAME:${{ github.sha }}" app

  test:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker build --build-arg BUILD_SHA=${{ github.sha }} --tag nginx-app:test app
      - name: Start container
        run: docker run --detach --rm --name nginx-app-test --publish 8080:8080 nginx-app:test
      - name: Wait for readiness
        run: |
          for attempt in {1..20}; do
            curl --fail --silent http://localhost:8080/healthz && exit 0
            sleep 1
          done
          exit 1
      - name: Run health check
        run: ./scripts/healthcheck.sh http://localhost:8080
      - name: Stop container
        if: always()
        run: docker rm --force nginx-app-test

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    needs: [lint, build, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6.9.0
        with:
          context: app
          push: true
          build-args: BUILD_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest