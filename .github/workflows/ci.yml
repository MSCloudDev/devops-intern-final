name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/msclouddev/devops-intern-final

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run ShellCheck
        run: shellcheck scripts/*.sh
      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg BUILD_SHA=${{ github.sha }} -t devops-project:test ./app

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build test image
        run: docker build --build-arg BUILD_SHA=${{ github.sha }} -t devops-project:test ./app
      - name: Start application
        run: docker run -d --name nginx-test -p 8080:8080 devops-project:test
      - name: Wait for application
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent http://localhost:8080/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs nginx-test
          exit 1
      - name: Run healthcheck
        run: bash scripts/healthcheck.sh http://localhost:8080/healthz
      - name: Stop application
        if: always()
        run: docker rm -f nginx-test

  publish:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: docker build --build-arg BUILD_SHA=${{ github.sha }} -t "$IMAGE_NAME:${{ github.sha }}" -t "$IMAGE_NAME:latest" ./app
      - name: Push images
        run: |
          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"