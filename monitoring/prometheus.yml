global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: nginx-app
    metrics_path: /metrics
    consul_sd_configs:
      - server: consul:8500
        services: [nginx-app-metrics]
    relabel_configs:
      - source_labels: [__meta_consul_service]
        target_label: service
      - source_labels: [__meta_consul_service_id]
        target_label: instance_id